[project]
name = "python-check-weather"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dinamitrii", email = "k_karaivanov@abv.bg" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "flask>=3.1.3",
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "nanodb>=0.4.3",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "segno>=1.6.6",
    "waitress>=3.0.2",
]

[project.scripts]
python-check-weather = "python_check_weather:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
