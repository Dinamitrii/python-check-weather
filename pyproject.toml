[project]
name = "python-check-weather"
version = "0.1.0"
description = "Flask weather app (Cloudflare Workers, uWSGI or Docker)"
readme = "README.md"
authors = [
    { name = "dinamitrii", email = "k_karaivanov@abv.bg" }
]
requires-python = ">=3.12"
# Runtime packages that pywrangler vendors into the Worker
dependencies = [
    "flask>=3.1.3",
    "segno>=1.6.6",
]

[dependency-groups]
# Local development only (not used on Cloudflare Workers)
dev = [
    "flake8==7.4.1",
    "pytest==9.1.1",
    "python-dotenv>=1.2.4",
    "pywrangler>=0.0.2",
    "requests==2.34.2",
    "waitress>=3.0.2",
]
