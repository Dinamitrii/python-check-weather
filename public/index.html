<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Времето</title>
</head>
<body>
  <h1>Времето в София</h1>
  <pre id="out">Зареждане...</pre>
  <script>
    fetch("/api/weather")
      .then(r => r.json())
      .then(d => document.getElementById("out").textContent = JSON.stringify(d, null, 2))
      .catch(e => document.getElementById("out").textContent = "Грешка: " + e);
  </script>
</body>
</html>
